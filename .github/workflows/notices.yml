name: Artifact notices

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check notice staging and archive preservation
        run: |
          command -v jq
          bash -n Script/package-notices.sh Script/build-openssl.sh Script/merge-xcframework.sh
          uv run --python 3.12 Script/test-notices.py
